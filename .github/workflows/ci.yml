name: CI

on: ["push", "pull_request"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: "./.tool-versions"
    # eslint-plugin-react and eslint-plugin-react-native
    # do not officially support eslint 10.
    # We make them compatible with eslint 10 with @eslint/compat,
    # and relax their eslint peer dependency with "overrides" in package.json.
    - run: npm ci
    - run: make print-all-rules
    - run: make check-all-rules-are-considered
    - run: npm run format
    - run: npm run test
