name: CD

on:
  push:
    tags: ["*"]

jobs:
  publish:
    # npm trusted publishing does not support self-hosted runners.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: "./.tool-versions"
        registry-url: "https://registry.npmjs.org"
    - name: Check tag matches package.json version
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PACKAGE_VERSION="$(node -p "require('./package.json').version")"
        if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION"
          exit 1
        fi
    - run: npm ci
    # prepublishOnly runs format and test before publishing.
    - run: npm publish --access public
